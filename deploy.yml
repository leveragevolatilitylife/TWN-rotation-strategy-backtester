name: Build and deploy to GitHub Pages

# 觸發時機：
#  1. push 到 main 分支的任何變更（含程式碼、或您上傳新版 data/Stock_data_collection.xlsx）
#  2. 也可以在 GitHub 網頁的 Actions 分頁手動點擊執行（workflow_dispatch）
on:
  push:
    branches: [main]
  workflow_dispatch:

# GitHub Pages（用官方 Actions 部署方式）需要的權限
permissions:
  contents: read
  pages: write
  id-token: write

# 同時間只允許一個部署在跑，避免互相覆蓋
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # 這一步會讀取 data/Stock_data_collection.xlsx，重新產生 src/data/twn_data.json
      # 只要您把新版 xlsx 檔覆蓋掉 data/Stock_data_collection.xlsx 並 push，
      # 這裡就會自動重新解析，網站上的回測資料就會跟著更新，不需要手動改任何程式碼。
      - name: Parse latest Stock_data_collection.xlsx into JSON
        run: npm run parse-data

      - name: Build site
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload build artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
