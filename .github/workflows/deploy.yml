name: Build and deploy to GitHub Pages

# 觸發時機：
#  1. push 到 main 分支的任何變更（含程式碼、或您上傳新版 data/Stock_data_collection.xlsx）
#  2. 也可以在 GitHub 網頁的 Actions 分頁手動點擊執行（workflow_dispatch）
#  3. 每天台灣時間 08:00 由外部服務 cron-job.org 呼叫 GitHub API 觸發（即 workflow_dispatch），
#     從私有 repo「stock-data-collection」的 data 分支抓最新 Stock_data_collection.xlsx 後重新解析並部署。
#     （不使用 GitHub 內建 schedule：它常被延遲甚至跳過。）
#     需先在本 repo 設定 Secret「DATA_REPO_TOKEN」（唯讀 Contents 權限的 fine-grained PAT）。
#  4. push 到 feature/** 測試分支時只「建置並驗證」，不會部署到正式網站；
#     建置結果會存成 Actions 的 artifact「site-preview」，下載解壓後可在本機預覽（見 README）。
on:
  push:
    branches: [main, "feature/**"]
  workflow_dispatch:

# GitHub Pages（用官方 Actions 部署方式）需要的權限
permissions:
  contents: read
  pages: write
  id-token: write

# 同時間只允許一個部署在跑，避免互相覆蓋
# 正式部署（main）共用同一個 group；測試分支各自獨立，避免互相取消
concurrency:
  group: ${{ github.ref == 'refs/heads/main' && 'pages' || format('preview-{0}', github.ref) }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # 從資料 repo（私有）的 data 分支抓最新 xlsx，覆蓋 data/Stock_data_collection.xlsx
      # - 未設定 DATA_REPO_TOKEN：略過並警告，沿用本 repo 內已提交的 xlsx（push 觸發的部署不會因此失敗）
      # - 已設定但抓取失敗（token 過期/權限不足）：讓這次建置失敗，避免悄悄用舊資料上線
      - name: Fetch latest data from stock-data-collection
        env:
          DATA_REPO_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
        run: |
          if [ -z "$DATA_REPO_TOKEN" ]; then
            echo "::warning::未設定 DATA_REPO_TOKEN，沿用 repo 內 data/Stock_data_collection.xlsx"
            exit 0
          fi
          TOKEN="$(printf '%s' "$DATA_REPO_TOKEN" | tr -d '[:space:]')"   # 去掉貼上時可能夾帶的空白／換行
          API="https://api.github.com/repos/leveragevolatilitylife/stock-data-collection"
          H=(-H "Authorization: Bearer $TOKEN" -H "X-GitHub-Api-Version: 2022-11-28")

          echo "--- 診斷資訊（不含金鑰內容） ---"
          case "$TOKEN" in
            github_pat_*) echo "token 類型：fine-grained PAT";;
            ghp_*)        echo "token 類型：classic PAT";;
            ghs_*)        echo "token 類型：GitHub App / Actions 內建 token（不是 PAT，無法讀其他 repo）";;
            *)            echo "token 類型：無法辨識（長度 ${#TOKEN}）";;
          esac
          code=$(curl -sS -o /tmp/me.json -w '%{http_code}' "${H[@]}" https://api.github.com/user || true)
          echo "GET /user -> HTTP $code $(grep -m1 '"login"' /tmp/me.json 2>/dev/null || true)"
          code=$(curl -sS -o /tmp/repo.json -D /tmp/repo.hdr -w '%{http_code}' "${H[@]}" "$API" || true)
          echo "GET repo -> HTTP $code（404 = 這把 token 看不到該 repo，未勾選 repo 或擁有者不對）"
          grep -i '^x-accepted-github-permissions' /tmp/repo.hdr || true

          # 以 Contents API 下載 data 分支的檔案（比 git clone 的錯誤訊息清楚）
          code=$(curl -sS -L -o /tmp/data.xlsx -D /tmp/dl.hdr -w '%{http_code}' "${H[@]}" \
            -H "Accept: application/vnd.github.raw" \
            "$API/contents/Stock_data_collection.xlsx?ref=data" || true)
          echo "GET contents -> HTTP $code"
          if [ "$code" != "200" ]; then
            echo "::error::下載失敗 (HTTP $code)。回應內容："; head -c 600 /tmp/data.xlsx; echo
            grep -i '^x-accepted-github-permissions' /tmp/dl.hdr || true
            echo "::error::請確認 fine-grained token：Repository access 已勾選 stock-data-collection，且 Contents = Read-only"
            exit 1
          fi
          if [ "$(head -c 2 /tmp/data.xlsx)" != "PK" ] || [ "$(stat -c%s /tmp/data.xlsx)" -lt 100000 ]; then
            echo "::error::下載到的內容不像有效的 xlsx（大小 $(stat -c%s /tmp/data.xlsx) bytes）"; exit 1
          fi
          cp /tmp/data.xlsx data/Stock_data_collection.xlsx
          ls -l data/Stock_data_collection.xlsx

      # 這一步會讀取 data/Stock_data_collection.xlsx，重新產生 src/data/twn_data.json
      # 只要您把新版 xlsx 檔覆蓋掉 data/Stock_data_collection.xlsx 並 push，
      # 這裡就會自動重新解析，網站上的回測資料就會跟著更新，不需要手動改任何程式碼。
      - name: Parse latest Stock_data_collection.xlsx into JSON
        run: npm run parse-data

      - name: Build site
        run: npm run build

      - name: Setup Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5

      - name: Upload build artifact (production)
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      # 測試分支：只留下可下載的預覽檔，不碰正式網站
      - name: Upload preview artifact (feature branches)
        if: github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: site-preview
          path: ./dist
          retention-days: 14

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
